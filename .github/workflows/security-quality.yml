name: security-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate synthetic assessment
        run: python -m src.cli data/synthetic_directory_inventory.json --output reports/generated-assessment.md

      - name: Validate generated report
        run: |
          test -s reports/generated-assessment.md
          grep -q "Active Directory Security Assessment" reports/generated-assessment.md
          grep -q "AD-001" reports/generated-assessment.md
